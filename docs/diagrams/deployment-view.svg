<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="430" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Deployment view: from commit to the user's browser</text>

  <!-- dev machine -->
  <rect x="20" y="70" width="170" height="130" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="105" y="96" text-anchor="middle" font-size="14" font-weight="bold">Developer machine</text>
  <text x="105" y="120" text-anchor="middle" font-size="12">Node 22, npm</text>
  <text x="105" y="138" text-anchor="middle" font-size="12">npm run dev / test</text>
  <text x="105" y="156" text-anchor="middle" font-size="12">git</text>
  <line x1="190" y1="135" x2="225" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="208" y="125" text-anchor="middle" font-size="11">push</text>

  <!-- repo -->
  <rect x="230" y="70" width="140" height="130" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="300" y="96" text-anchor="middle" font-size="14" font-weight="bold">GitHub repo</text>
  <text x="300" y="120" text-anchor="middle" font-size="12">branch: main</text>
  <text x="300" y="138" text-anchor="middle" font-size="12">deploy.yml</text>
  <line x1="370" y1="135" x2="400" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="387" y="125" text-anchor="middle" font-size="11">runs</text>

  <!-- actions -->
  <rect x="405" y="55" width="300" height="300" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="555" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">GitHub Actions runner (ubuntu-latest)</text>
  <g font-size="12">
    <rect x="425" y="95" width="260" height="30" rx="4" fill="#fff" stroke="#15803d"/><text x="555" y="115" text-anchor="middle">1. checkout, setup-node 22, npm ci</text>
    <rect x="425" y="135" width="260" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="555" y="153" text-anchor="middle" font-weight="bold">2. npm run coverage  (quality gate)</text><text x="555" y="169" text-anchor="middle">51 tests, thresholds 80%</text>
    <rect x="425" y="187" width="260" height="30" rx="4" fill="#fff" stroke="#15803d"/><text x="555" y="207" text-anchor="middle">3. npm run build  → dist/</text>
    <rect x="425" y="227" width="260" height="30" rx="4" fill="#fff" stroke="#15803d"/><text x="555" y="247" text-anchor="middle">4. upload-pages-artifact</text>
    <rect x="425" y="267" width="260" height="30" rx="4" fill="#fff" stroke="#15803d"/><text x="555" y="287" text-anchor="middle">5. deploy job: deploy-pages</text>
  </g>
  <text x="555" y="322" text-anchor="middle" font-size="11" fill="#7f1d1d">if step 2 fails, steps 3 to 5 never run</text>
  <text x="555" y="338" text-anchor="middle" font-size="11" fill="#7f1d1d">and the live site keeps the last good version</text>

  <line x1="705" y1="282" x2="740" y2="282" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- pages -->
  <rect x="745" y="215" width="195" height="135" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="842" y="240" text-anchor="middle" font-size="14" font-weight="bold">GitHub Pages CDN</text>
  <text x="842" y="262" text-anchor="middle" font-size="12">index.html</text>
  <text x="842" y="279" text-anchor="middle" font-size="12">assets/index-*.js (225 kB)</text>
  <text x="842" y="296" text-anchor="middle" font-size="12">assets/index-*.css</text>
  <text x="842" y="320" text-anchor="middle" font-size="11">ologunv.github.io/</text>
  <text x="842" y="335" text-anchor="middle" font-size="11">Unit-converter-app/</text>

  <!-- browser -->
  <rect x="745" y="55" width="195" height="125" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="842" y="80" text-anchor="middle" font-size="14" font-weight="bold">User device</text>
  <text x="842" y="100" text-anchor="middle" font-size="12">desktop or phone browser</text>
  <text x="842" y="122" text-anchor="middle" font-size="12">UI + domain JS bundle</text>
  <text x="842" y="140" text-anchor="middle" font-size="12">localStorage (history)</text>
  <line x1="842" y1="212" x2="842" y2="184" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="852" y="203" font-size="11">HTTPS GET</text>

  <text x="20" y="400" font-size="12" fill="#374151">Vite base './' makes asset paths relative, so the same build works under the /Unit-converter-app/ sub-path.</text>
</svg>
