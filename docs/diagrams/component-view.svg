<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Component view: layers and dependencies</text>

  <!-- UI layer -->
  <rect x="40" y="55" width="600" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="58" y="80" font-size="15" font-weight="bold" fill="#78350f">UI layer  (src/ui, React)</text>
  <rect x="60" y="95" width="560" height="40" rx="5" fill="#fff" stroke="#b45309"/>
  <text x="340" y="113" text-anchor="middle" font-size="14" font-weight="bold">App.jsx</text>
  <text x="340" y="129" text-anchor="middle" font-size="11">holds state, calls convertText() on every render, injects localStorage</text>
  <rect x="60" y="148" width="170" height="40" rx="5" fill="#fff" stroke="#b45309"/>
  <text x="145" y="173" text-anchor="middle" font-size="13">CategoryTabs.jsx</text>
  <rect x="255" y="148" width="170" height="40" rx="5" fill="#fff" stroke="#b45309"/>
  <text x="340" y="173" text-anchor="middle" font-size="13">UnitSelect.jsx</text>
  <rect x="450" y="148" width="170" height="40" rx="5" fill="#fff" stroke="#b45309"/>
  <text x="535" y="173" text-anchor="middle" font-size="13">History.jsx</text>

  <!-- arrow UI -> domain -->
  <line x1="340" y1="205" x2="340" y2="262" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="352" y="230" font-size="12">imports (one direction only)</text>
  <text x="352" y="246" font-size="12">domain never imports UI</text>

  <!-- Domain layer -->
  <rect x="40" y="265" width="600" height="160" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="58" y="290" font-size="15" font-weight="bold" fill="#1e3a8a">Domain layer  (src/domain, plain JavaScript, no React, no DOM)</text>
  <rect x="60" y="305" width="170" height="100" rx="5" fill="#fff" stroke="#1d4ed8"/>
  <text x="145" y="328" text-anchor="middle" font-size="14" font-weight="bold">convert.js</text>
  <text x="145" y="348" text-anchor="middle" font-size="11">convert, getUnit</text>
  <text x="145" y="364" text-anchor="middle" font-size="11">parseInput, formatResult</text>
  <text x="145" y="380" text-anchor="middle" font-size="11">convertText</text>
  <text x="145" y="396" text-anchor="middle" font-size="11">ConversionError</text>
  <rect x="255" y="305" width="170" height="100" rx="5" fill="#fff" stroke="#1d4ed8"/>
  <text x="340" y="328" text-anchor="middle" font-size="14" font-weight="bold">units.js</text>
  <text x="340" y="348" text-anchor="middle" font-size="11">6 categories, 34 units</text>
  <text x="340" y="364" text-anchor="middle" font-size="11">factor to a base unit</text>
  <text x="340" y="380" text-anchor="middle" font-size="11">temperature: toBase /</text>
  <text x="340" y="396" text-anchor="middle" font-size="11">fromBase functions</text>
  <line x1="250" y1="355" x2="233" y2="355" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <rect x="450" y="305" width="170" height="100" rx="5" fill="#fff" stroke="#1d4ed8"/>
  <text x="535" y="328" text-anchor="middle" font-size="14" font-weight="bold">history.js</text>
  <text x="535" y="348" text-anchor="middle" font-size="11">loadHistory, addToHistory</text>
  <text x="535" y="364" text-anchor="middle" font-size="11">clearHistory</text>
  <text x="535" y="384" text-anchor="middle" font-size="11" font-style="italic">storage passed in</text>
  <text x="535" y="398" text-anchor="middle" font-size="11" font-style="italic">as a parameter</text>

  <!-- storage interface -->
  <rect x="440" y="460" width="190" height="62" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="535" y="484" text-anchor="middle" font-size="13" font-weight="bold">Storage interface</text>
  <text x="535" y="503" text-anchor="middle" font-size="11">getItem, setItem, removeItem</text>
  <line x1="535" y1="405" x2="535" y2="455" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="545" y="436" font-size="11">uses</text>

  <rect x="230" y="470" width="170" height="44" rx="5" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="315" y="490" text-anchor="middle" font-size="13">window.localStorage</text>
  <text x="315" y="506" text-anchor="middle" font-size="11">(production, from App.jsx)</text>
  <line x1="400" y1="492" x2="435" y2="492" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- tests -->
  <rect x="700" y="265" width="230" height="160" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="815" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Test suite (Vitest)</text>
  <text x="815" y="314" text-anchor="middle" font-size="12">src/domain/__tests__</text>
  <text x="815" y="338" text-anchor="middle" font-size="12">convert.test.js  (45 tests)</text>
  <text x="815" y="356" text-anchor="middle" font-size="12">history.test.js  (6 tests)</text>
  <text x="815" y="380" text-anchor="middle" font-size="12">calls domain functions</text>
  <text x="815" y="396" text-anchor="middle" font-size="12">directly, no browser</text>
  <line x1="695" y1="345" x2="645" y2="345" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="700" y="465" width="230" height="52" rx="5" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="815" y="487" text-anchor="middle" font-size="13">fakeStorage / brokenStorage</text>
  <text x="815" y="505" text-anchor="middle" font-size="11">(test doubles in history.test.js)</text>
  <line x1="695" y1="491" x2="635" y2="491" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="665" y="535" text-anchor="middle" font-size="11">both implement the same interface</text>
</svg>
